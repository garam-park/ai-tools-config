name: Merge Requirements

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # M-1.1 + M-1.2: 셸 정적 검사 + 설치 테스트 (ubuntu + macOS)
  # macOS는 Docker 컨테이너 액션을 지원하지 않아 ludeeus/action-shellcheck 대신
  # brew로 shellcheck를 설치해 직접 실행한다.
  shell-and-tests:
    name: ShellCheck + Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (Linux)
        if: runner.os == 'Linux'
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          additional_files: bootstrap.sh install-skills.sh install-global-instructions.sh tests/installers_test.sh
      - name: ShellCheck (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shellcheck
          shellcheck --severity=warning bootstrap.sh install-skills.sh install-global-instructions.sh tests/installers_test.sh

      - name: Run installer tests
        run: bash tests/installers_test.sh

  # M-1.5: AI 트레일러 부재
  no-ai-trailers:
    name: No AI trailers in commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject Co-Authored-By / Generated with
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          bad="$(git log "$BASE..$HEAD" --pretty='%B' | grep -iE 'co-authored-by: (claude|copilot|cursor|cody|gpt)|generated with (claude code|copilot|cursor|cody)|ai-generated' || true)"
          if [ -n "$bad" ]; then
            echo "::error::커밋에 AI 트레일러/푸터가 포함되어 있습니다:"
            echo "$bad"
            exit 1
          fi
          echo "OK: AI 트레일러가 없습니다."

  # M-1.6: agents 디렉토리 무결성 (글로벌·프로젝트 전용 스킬 모두)
  agents-integrity:
    name: agents/ integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check codex.yaml exists, openai.yaml removed
        run: |
          set -euo pipefail
          # 모든 글로벌·프로젝트 전용 스킬에 agents/codex.yaml 이 있어야 한다
          missing=0
          for root in skills .agents/skills; do
            [[ -d "$root" ]] || continue
            for d in "$root"/*/; do
              [[ -f "${d}SKILL.md" ]] || continue
              [[ -f "${d}agents/codex.yaml" ]] || {
                echo "::error::${d}agents/codex.yaml 이 없습니다."
                missing=1
              }
            done
          done
          # 옛 agents/openai.yaml 가 어디에도 남아있으면 안 된다
          if find skills .agents/skills -path '*/agents/openai.yaml' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::옛 agents/openai.yaml 가 아직 존재합니다. 제거하세요."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "OK: agents/ 무결성 검사 통과 (codex.yaml 전 스킬 보유, openai.yaml 부재)."
